name: DWBOT Gate A 16-image OCR.Space PDF-first acceptance

# Historical Gate A run #42202563673 is quarantined: its first provider request lacked proven restricted-egress enforcement.
# Its PDF may be reused for local-only diagnosis, but it cannot count toward Gate A or authorize remaining provider requests.
# A compliant Gate A result requires a fresh, fully guarded 16-image run with a new diagnostic log and locked source fingerprint.
# The LOCAL-ONLY-RECOVERY and RESUME-15 paths remain fail-closed and must never repeat or extend the historical partial batch.
# The local-only helper rebinds NODE_OPTIONS for its child process because its cwd is sourceRoot.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dwbot-gateA-16-pdf-first.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Only the no-provider local recovery path is available for manual runs.'
        type: choice
        required: true
        default: LOCAL-ONLY-RECOVERY
        options:
          - LOCAL-ONLY-RECOVERY

permissions:
  contents: read
  actions: read

concurrency:
  group: dwbot-gateA-16-pdf-first-adaf4f8c
  cancel-in-progress: false

env:
  GATEB_SOURCE_SHA: adaf4f8c3a9573f56d0348a4bba36686fc31c22e
  GATEB_SOURCE_RUN_ID: '42160979140'

jobs:
  gate-a:
    if: github.run_attempt == 1 && ((github.event_name == 'workflow_dispatch' && inputs.mode == 'LOCAL-ONLY-RECOVERY') || (github.event_name == 'push' && (github.event.head_commit.message == 'DWBOT-GATE-A-16-PDF-FIRST-ONE-TIME' || github.event.head_commit.message == 'DWBOT-GATE-A-16-PDF-FIRST-RESUME-15' || github.event.head_commit.message == 'DWBOT-GATE-A-16-LOCAL-ONLY-RECOVERY')))
    runs-on: windows-latest
    timeout-minutes: 240
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out current preflight tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 22.16.0 for source preflight
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.16.0
          package-manager-cache: false

      - name: Install preflight dependencies
        run: |
          npm ci --no-audit --no-fund
          node --check scripts/run-gateA-parallel-reader-matrix.js
          node --check scripts/prepare-gateA-16-resume.js

      - name: Verify completed Gate B source run fingerprint
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $run = gh run view $env:GATEB_SOURCE_RUN_ID --repo $env:GITHUB_REPOSITORY --json headSha,status,conclusion
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect the completed Gate B source run.' }
          $source = $run | ConvertFrom-Json
          if ($source.status -ne 'completed' -or $source.conclusion -ne 'success') { throw 'Gate B source run is not completed successfully.' }
          if ($source.headSha -ne $env:GATEB_SOURCE_SHA) { throw 'Gate A candidate SHA does not match the Gate B source run SHA.' }
          "Gate B run $env:GATEB_SOURCE_RUN_ID is completed and bound to $($source.headSha)."

      - name: Preflight all 16 development images and nine-field labels
        shell: powershell
        run: |
          node scripts/preflight-additional-screenshot-corpus.js --candidate-sha $env:GATEB_SOURCE_SHA --gateb-run-id $env:GATEB_SOURCE_RUN_ID --gateb-source-sha $env:GATEB_SOURCE_SHA --output testdata/gateA-16-preflight.json
          if ($LASTEXITCODE -ne 0) { throw 'Gate A source preflight failed; no OCR.Space requests were made.' }

      - name: Check out the exact Gate B candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: adaf4f8c3a9573f56d0348a4bba36686fc31c22e
          path: source
          persist-credentials: false

      - name: Set up accepted Node.js 22.16.0 runtime for Gate A acceptance
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.16.0
          package-manager-cache: false

      - name: Install local OCR and PDF runtime
        shell: powershell
        run: |
          choco install tesseract --version=5.5.3.20260724 --yes --no-progress
          choco install imagemagick --yes --no-progress
          choco install ghostscript --yes --no-progress
          Import-Module "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1"
          refreshenv
          $tesseract = Get-Command tesseract.exe -ErrorAction Stop
          $magick = Get-Command magick.exe -ErrorAction Stop
          $ghostscript = Get-Command gswin64c.exe -ErrorAction Stop
          $tessdata = Join-Path (Split-Path $tesseract.Source -Parent) 'tessdata'
          if (-not (Test-Path (Join-Path $tessdata 'eng.traineddata'))) { throw 'English Tesseract model is missing.' }
          & $magick.Source -version
          if ($LASTEXITCODE -ne 0) { throw 'ImageMagick is unavailable.' }
          & $ghostscript.Source -version
          if ($LASTEXITCODE -ne 0) { throw 'Ghostscript is unavailable.' }
          "TESSERACT_BIN=$($tesseract.Source)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "TESSERACT_LANG_PATH=$tessdata" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "IMAGEMAGICK_BIN=$($magick.Source)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "GHOSTSCRIPT_BIN=$($ghostscript.Source)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Provision pinned local PaddleOCR CPU runtime and PP-OCRv6 models
        shell: powershell
        run: |
          $runtimeRoot = Join-Path $env:LOCALAPPDATA 'WoWSYOLO\PaddleOCR'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/install-paddleocr-windows.ps1 -ProjectRoot $env:GITHUB_WORKSPACE -RuntimeRoot $runtimeRoot -SkipProjectBenchmark
          if ($LASTEXITCODE -ne 0) { throw 'Pinned PaddleOCR setup or offline inference verification failed.' }
          $python = Join-Path $runtimeRoot 'venv\Scripts\python.exe'
          $det = Join-Path $runtimeRoot 'models\PP-OCRv6_medium_det'
          $rec = Join-Path $runtimeRoot 'models\PP-OCRv6_medium_rec'
          $modelManifest = Join-Path $runtimeRoot 'models\paddleocr-model-manifest.json'
          $installManifest = Join-Path $runtimeRoot 'install-manifest.json'
          foreach ($item in @($python,$det,$rec,$modelManifest,$installManifest)) { if (-not (Test-Path $item)) { throw "PaddleOCR runtime evidence missing: $item" } }
          $evidence = Join-Path $env:GITHUB_WORKSPACE 'testdata\gateA-16'
          New-Item -ItemType Directory -Force $evidence | Out-Null
          Copy-Item $modelManifest (Join-Path $evidence 'paddleocr-model-manifest.json') -Force
          Copy-Item $installManifest (Join-Path $evidence 'paddleocr-install-manifest.json') -Force
          "PADDLEOCR_PYTHON_BIN=$python" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "PADDLEOCR_DET_MODEL_DIR=$det" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "PADDLEOCR_REC_MODEL_DIR=$rec" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "PADDLEOCR_MODEL_MANIFEST=$modelManifest" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "PADDLE_PDX_ENABLE_MKLDNN_BYDEFAULT=False" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "PADDLEOCR_FIELD_FALLBACK_TIMEOUT_MS=60000" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "PADDLEOCR_FIELD_FALLBACK_MAX_CROPS=7" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install exact candidate dependencies
        working-directory: source
        run: |
          node --version
          npm --version
          npm ci --no-audit --no-fund

      - name: Configure fail-closed restricted-egress diagnostic preload
        shell: powershell
        run: |
          $candidateGuard = Join-Path $env:GITHUB_WORKSPACE 'source/scripts/block-network.js'
          $failClosedGuard = Join-Path $env:GITHUB_WORKSPACE 'scripts/block-network.js'
          if (-not (Test-Path $candidateGuard)) { throw 'Candidate restricted-egress guard is missing.' }
          if (-not (Test-Path $failClosedGuard)) { throw 'Current fail-closed network guard is missing.' }
          # NODE_OPTIONS is set per Node step below; GitHub Actions blocks writing it through GITHUB_ENV.
          Write-Host 'Both guard sources verified; each OCR/local-reader Node step will preload them explicitly.'

      - name: Download and verify original partial Gate A artifact
        if: github.event.head_commit.message == 'DWBOT-GATE-A-16-PDF-FIRST-RESUME-15' || github.event.head_commit.message == 'DWBOT-GATE-A-16-LOCAL-ONLY-RECOVERY' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'LOCAL-ONLY-RECOVERY')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $priorRunId = '42202563673'
          $expectedWorkflowHeadSha = '036f31181272d89ed2d678ca1b512c953f563106'
          $priorArtifactId = 13495008195
          $expectedDigest = 'sha256:398f8152847cd3ea58fb9e16ac01886fced0c880869ce6a430d3343e5cb4ecd8'
          $priorJson = gh run view $priorRunId --repo $env:GITHUB_REPOSITORY --json name,headSha,status,conclusion
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect the original partial Gate A run.' }
          $prior = $priorJson | ConvertFrom-Json
          if ($prior.name -ne 'DWBOT Gate A 16-image OCR.Space PDF-first acceptance' -or $prior.headSha -ne $expectedWorkflowHeadSha -or $prior.status -ne 'completed' -or $prior.conclusion -ne 'cancelled') { throw 'Original Gate A run identity/state does not match the approved partial source run.' }
          $artifactJson = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$priorRunId/artifacts"
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect original Gate A artifacts.' }
          $artifact = (($artifactJson | ConvertFrom-Json).artifacts | Where-Object { $_.id -eq $priorArtifactId })
          if ($null -eq $artifact -or $artifact.name -ne "dwbot-gateA-16-pdf-first-$priorRunId" -or $artifact.expired -ne $false -or $artifact.size_in_bytes -ne 1519776 -or $artifact.digest -ne $expectedDigest) { throw 'Original partial Gate A artifact ID/name/size/digest did not match the recorded artifact.' }
          $partialDir = Join-Path $env:RUNNER_TEMP 'dwbot-gateA-partial-42202563673'
          New-Item -ItemType Directory -Force $partialDir | Out-Null
          gh run download $priorRunId --repo $env:GITHUB_REPOSITORY --name $artifact.name --dir $partialDir
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the original partial Gate A artifact.' }
          $logLines = gh run view $priorRunId --repo $env:GITHUB_REPOSITORY --log
          if ($LASTEXITCODE -ne 0) { throw 'Could not retrieve the original partial Gate A job log.' }
          [System.IO.File]::WriteAllText((Join-Path $partialDir 'original-run.log'), ($logLines -join [Environment]::NewLine))
          "GATEA_PARTIAL_ARTIFACT_DIR=$partialDir" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "GATEA_PARTIAL_ARTIFACT_ID=$priorArtifactId" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "GATEA_PARTIAL_ARTIFACT_SHA256=398f8152847cd3ea58fb9e16ac01886fced0c880869ce6a430d3343e5cb4ecd8" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      # Original gate-a-acceptance.json contains a UTF-8 BOM; the recovery helper parses BOM-safe JSON.
      # Child OCR output and the enriched resume report use separate files; missing original egress evidence blocks all remaining paid requests.
      - name: Prepare no-duplicate Gate A resume checkpoint from existing PDF
        if: github.event.head_commit.message == 'DWBOT-GATE-A-16-PDF-FIRST-RESUME-15' || github.event.head_commit.message == 'DWBOT-GATE-A-16-LOCAL-ONLY-RECOVERY' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'LOCAL-ONLY-RECOVERY')
        shell: powershell
        env:
          OCRSPACE_ENABLED: '0'
          OCRSPACE_NETWORK_ALLOWLIST: '0'
          OCR_NON_OCR_NETWORK_RESTRICTED: '1'
          OCR_NON_OCR_NETWORK_LOG: ${{ github.workspace }}/testdata/gateA-16/local-recovery-network.log
          NODE_OPTIONS: '--require=./source/scripts/block-network.js --require=./scripts/block-network.js'
        run: |
          node scripts/prepare-gateA-16-resume.js --source-root source --preflight testdata/gateA-16-preflight.json --partial-artifact-root "$env:GATEA_PARTIAL_ARTIFACT_DIR"
          if ($LASTEXITCODE -ne 0) { throw 'First-image local recovery or original artifact verification failed; no remaining provider requests may start.' }

      - name: Initialize Gate A restricted-egress diagnostic log
        if: github.event_name != 'workflow_dispatch' && github.event.head_commit.message != 'DWBOT-GATE-A-16-LOCAL-ONLY-RECOVERY'
        shell: powershell
        run: |
          $log = Join-Path $env:GITHUB_WORKSPACE 'source/testdata/gateA-16/non-ocr-network-attempts.log'
          New-Item -ItemType Directory -Force (Split-Path $log -Parent) | Out-Null
          [System.IO.File]::WriteAllText($log, '')
          if (-not (Test-Path $log) -or (Get-Item $log).Length -ne 0) { throw 'Could not initialize an empty Gate A restricted-egress log before provider calls.' }

      - name: Run the 16-image OCR.Space Engine 2 PDF-first Gate A acceptance
        if: github.event_name != 'workflow_dispatch' && github.event.head_commit.message != 'DWBOT-GATE-A-16-LOCAL-ONLY-RECOVERY'
        working-directory: source
        env:
          OCRSPACE_API_KEY: ${{ secrets.OCRSPACE_API_KEY }}
          OCRSPACE_ENABLED: '1'
          OCRSPACE_NETWORK_ALLOWLIST: '1'
          OCR_NON_OCR_NETWORK_RESTRICTED: '1'
          NODE_OPTIONS: '--require=./scripts/block-network.js --require=../scripts/block-network.js'
          OCR_SEQUENCE_REPORT_PATH: testdata/gateA-16/report.json
          OCR_NON_OCR_NETWORK_LOG: testdata/gateA-16/non-ocr-network-attempts.log
          OCRSPACE_ARTIFACT_DIR: testdata/gateA-16/artifacts
          OCR_IMAGE_TIMEOUT_MS: '180000'
          OCR_SUPERVISED_TIMEOUT_MS: '185000'
          OCR_SEQUENCE_RESUME_FROM: ${{ github.event.head_commit.message == 'DWBOT-GATE-A-16-PDF-FIRST-RESUME-15' && 'testdata/gateA-16/resume-from-progress.json' || '' }}
        run: node scripts/run-additional-screenshot-regression.js

      - name: Run Gate A parallel local-reader matrix on verified PDF artifacts
        if: always()
        shell: powershell
        env:
          OCRSPACE_NETWORK_ALLOWLIST: '0'
          OCR_NON_OCR_NETWORK_RESTRICTED: '1'
          OCR_NON_OCR_NETWORK_LOG: ${{ github.workspace }}/testdata/gateA-16/parallel-reader-network.log
          NODE_OPTIONS: '--require=./scripts/block-network.js'
          PADDLEOCR_FIELD_FALLBACK: '1'
        run: |
          $sourceRoot = Join-Path $env:GITHUB_WORKSPACE 'source'
          $reportPath = Join-Path $sourceRoot 'testdata/gateA-16/report.json'
          $auditPath = $reportPath + '.pdf-audit.json'
          $manifestPath = Join-Path $sourceRoot 'testdata/additional-screenshot-ground-truth.json'
          $artifactRoot = Join-Path $sourceRoot 'testdata/gateA-16/artifacts'
          $outputPath = Join-Path $env:GITHUB_WORKSPACE 'testdata/gateA-16/parallel-reader-matrix.json'
          $networkLog = $env:OCR_NON_OCR_NETWORK_LOG
          New-Item -ItemType Directory -Force (Split-Path $networkLog -Parent) | Out-Null
          [System.IO.File]::WriteAllText($networkLog, '')
          if (-not (Test-Path $reportPath) -or -not (Test-Path $auditPath)) {
            Write-Host 'Gate A matrix skipped: no completed source report/PDF audit; no provider requests made.'
            exit 0
          }
          node scripts/run-gateA-parallel-reader-matrix.js --run-report $reportPath --manifest $manifestPath --pdf-audit $auditPath --artifact-root $artifactRoot --output $outputPath --network-log $networkLog
          if ($LASTEXITCODE -ne 0) { throw 'Gate A parallel-reader matrix was incomplete or had a restricted-egress attempt.' }

      - name: Create source-bound Gate A acceptance report
        if: always()
        shell: powershell
        run: |
          $sourceRoot = Join-Path $env:GITHUB_WORKSPACE 'source'
          $reportPath = Join-Path $sourceRoot 'testdata/gateA-16/report.json'
          $auditPath = $reportPath + '.pdf-audit.json'
          $networkPath = Join-Path $sourceRoot 'testdata/gateA-16/non-ocr-network-attempts.log'
          $preflightPath = Join-Path $env:GITHUB_WORKSPACE 'testdata/gateA-16-preflight.json'
          $nodeVersion = (node --version).Trim()
          $runtimePass = $false
          try { $runtimePass = ([version]$nodeVersion.TrimStart('v')) -ge ([version]'22.16.0') } catch { $runtimePass = $false }
          $report = if (Test-Path $reportPath) { Get-Content -Raw $reportPath | ConvertFrom-Json } else { $null }
          $audit = if (Test-Path $auditPath) { Get-Content -Raw $auditPath | ConvertFrom-Json } else { $null }
          $preflight = if (Test-Path $preflightPath) { Get-Content -Raw $preflightPath | ConvertFrom-Json } else { $null }
          $networkExists = Test-Path $networkPath
          $networkBytes = if ($networkExists) { (Get-Item $networkPath).Length } else { -1 }
          $network = $report.networkIsolation
          $resumeManifestPath = Join-Path $sourceRoot 'testdata/gateA-16/resume-manifest.json'
          $resumeManifest = if (Test-Path $resumeManifestPath) { Get-Content -Raw $resumeManifestPath | ConvertFrom-Json } else { $null }
          $isResume = -not [string]::IsNullOrWhiteSpace($env:GATEA_PARTIAL_ARTIFACT_ID)
          $originalNetworkEvidencePass = if (-not $isResume) { $true } else { $null -ne $resumeManifest -and $resumeManifest.originalNetworkLogStatus -eq 'PRESENT' -and $resumeManifest.originalNetworkAttemptCount -eq 0 }
          $matrixPath = Join-Path $env:GITHUB_WORKSPACE 'testdata/gateA-16/parallel-reader-matrix.json'
          $matrix = if (Test-Path $matrixPath) { Get-Content -Raw $matrixPath | ConvertFrom-Json } else { $null }
          $matrixPass = $null -ne $matrix -and $matrix.status -eq 'COMPLETED_DIAGNOSTIC_MATRIX' -and $matrix.inventory.imageCount -eq 16 -and $matrix.network.blockedAttempts -eq 0
          $reportPass = $null -ne $report -and $report.imageCount -eq 16 -and $report.completedImages -eq 16 -and $report.exactMatches -eq 16 -and $report.mandatoryExactMatches -eq 16 -and $report.requiredFieldsComplete -eq 16 -and $report.results.Count -eq 16 -and @($report.results | Where-Object { $_.pipelineCompleted -ne $true -or $_.allExpectedFieldsPass -ne $true -or $_.allRequiredFieldsPass -ne $true -or $_.requiredMissing.Count -ne 0 }).Count -eq 0
          $auditPass = $null -ne $audit -and $audit.sourceCount -eq 16 -and $audit.verifiedPdfCount -eq 16 -and $audit.images.Count -eq 16 -and @($audit.images | Where-Object { $_.valid -ne $true }).Count -eq 0
          $currentNetworkPass = $null -ne $network -and $network.ocrSpaceEnabled -eq $true -and $network.ocrSpaceNetworkAllowed -eq $true -and $network.nonOcrNetworkRestricted -eq $true -and $network.nonOcrDeniedAttemptsDetected -eq $false -and $networkExists -and $networkBytes -eq 0
          $networkPass = $currentNetworkPass -and $originalNetworkEvidencePass
          $fingerprintPass = $null -ne $preflight -and $preflight.status -eq 'PREFLIGHT_PASS_NO_PROVIDER_REQUESTS' -and $preflight.candidateFingerprint -eq $env:GATEB_SOURCE_SHA -and $preflight.candidateFingerprintMatchesGateBSource -eq $true
          $requiredFields = @('result','player','map','mode','battleStart','credits','freeXp','damage','xp')
          $wronglyAccepted = 0
          $unresolved = 0
          if ($report) {
            foreach ($row in $report.results) {
              foreach ($field in $requiredFields) {
                $actualValue = $row.actual.$field
                $expectedValue = $row.expected.$field
                if ($null -eq $actualValue -or [string]::IsNullOrWhiteSpace([string]$actualValue)) { $unresolved++ }
                elseif ([string]$actualValue -cne [string]$expectedValue) { $wronglyAccepted++ }
              }
            }
          }
          $reportSha = if (Test-Path $reportPath) { (Get-FileHash -Algorithm SHA256 $reportPath).Hash.ToLowerInvariant() } else { $null }
          $gateAStatus = if ($reportPass -and $auditPass -and $networkPass -and $fingerprintPass -and $runtimePass -and $matrixPass) { 'PASS' } else { 'FAIL' }
          $networkRestriction = if ($networkPass) { 'PASS' } elseif ($isResume -and -not $originalNetworkEvidencePass) { 'FAIL_MISSING_ORIGINAL_EVIDENCE' } else { 'FAIL' }
          $summary = [ordered]@{
            schemaVersion = 1
            gate = 'A'
            status = $gateAStatus
            candidateFingerprint = $env:GATEB_SOURCE_SHA
            candidateFingerprintMatchesGateBSource = $fingerprintPass
            fingerprintLocked = $fingerprintPass
            matchesGateBRunSource = $fingerprintPass
            gateBSourceRunId = $env:GATEB_SOURCE_RUN_ID
            gateBSourceCommitSha = $env:GATEB_SOURCE_SHA
            nodeVersion = $nodeVersion
            runtimePass = $runtimePass
            parallelReaderMatrixPass = $matrixPass
            parallelReaderMatrixStatus = if ($matrix) { $matrix.status } else { 'MISSING' }
            parallelReaderMatrixSha256 = if (Test-Path $matrixPath) { (Get-FileHash -Algorithm SHA256 $matrixPath).Hash.ToLowerInvariant() } else { $null }
            parallelReaderMatrixAnalyzedImages = if ($matrix) { @($matrix.images | Where-Object { $_.status -eq 'ANALYZED' }).Count } else { 0 }
            parallelReaderMatrixNetwork = if ($matrix) { $matrix.network } else { $null }
            sourceImageCount = if ($preflight) { $preflight.imageCount } else { 0 }
            completeImages = if ($report) { $report.completedImages } else { 0 }
            exactCompleteRecords = if ($report) { $report.exactMatches } else { $null }
            exactMatches = if ($report) { $report.exactMatches } else { $null }
            mandatoryExactMatches = if ($report) { $report.mandatoryExactMatches } else { $null }
            requiredFieldsComplete = if ($report) { $report.requiredFieldsComplete } else { $null }
            wronglyAcceptedMandatoryFieldValues = $wronglyAccepted
            unresolvedMandatoryFieldValues = $unresolved
            unauthorizedNetworkAttempts = if ($networkPass) { 0 } else { $null }
            networkRestriction = $networkRestriction
            verifiedPdfCount = if ($audit) { $audit.verifiedPdfCount } else { 0 }
            reportPass = $reportPass
            pdfAuditPass = $auditPass
            networkPass = $networkPass
            networkLogBytes = $networkBytes
            networkIsolation = $network
            originalNetworkLogStatus = if (-not $isResume) { 'NOT_APPLICABLE_FRESH_RUN' } elseif ($resumeManifest) { $resumeManifest.originalNetworkLogStatus } else { 'MISSING_ORIGINAL_NETWORK_LOG' }
            originalNetworkAttemptCount = if (-not $isResume) { 0 } elseif ($resumeManifest) { $resumeManifest.originalNetworkAttemptCount } else { $null }
            resumeManifestSha256 = if (Test-Path $resumeManifestPath) { (Get-FileHash -Algorithm SHA256 $resumeManifestPath).Hash.ToLowerInvariant() } else { $null }
            resumeManifest = $resumeManifest
            sourceBuildSha256 = if ($report -and $report.reportMetadata) { $report.reportMetadata.sourceBuild.sha256 } else { $null }
            sourcePreflightSha256 = if (Test-Path $preflightPath) { (Get-FileHash -Algorithm SHA256 $preflightPath).Hash.ToLowerInvariant() } else { $null }
            reportSha256 = $reportSha
            runReportSha256 = $reportSha
            pdfAuditSha256 = if (Test-Path $auditPath) { (Get-FileHash -Algorithm SHA256 $auditPath).Hash.ToLowerInvariant() } else { $null }
            networkLogSha256 = if ($networkExists) { (Get-FileHash -Algorithm SHA256 $networkPath).Hash.ToLowerInvariant() } else { $null }
          }
          $out = Join-Path $sourceRoot 'testdata/gateA-16/gate-a-acceptance.json'
          New-Item -ItemType Directory -Force (Split-Path $out -Parent) | Out-Null
          $summary | ConvertTo-Json -Depth 30 | Set-Content -Encoding utf8 $out
          Write-Host "DWBOT GATE A: $gateAStatus; exact=$($summary.exactMatches)/16; PDF=$($summary.verifiedPdfCount)/16; network=$networkPass; fingerprint=$fingerprintPass; runtime=$nodeVersion/$runtimePass"
          if ($gateAStatus -ne 'PASS') { throw 'Gate A acceptance requirements were not all met. Evidence artifact will still be uploaded.' }

      - name: Upload Gate A source, reports, PDFs and PDF-derived rasters
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dwbot-gateA-16-pdf-first-${{ github.run_id }}
          path: |
            testdata/gateA-16-preflight.json
            source/testdata/additional-screenshot-ground-truth.json
            source/testdata/gateA-16/report.json
