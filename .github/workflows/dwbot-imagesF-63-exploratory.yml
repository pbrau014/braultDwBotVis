name: DWBOT imagesF 63 exploratory OCR.Space

concurrency:
  group: dwbot-imagesF-63-exploratory-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches:
      - main
    # Documentation and ground-truth/evaluation artifacts must not trigger
    # another billable 63-image OCR.Space submission run.
    paths-ignore:
      - 'testdata/ground-truth/**'
      - 'docs/continuation/**'
      - 'scripts/evaluate-ocrspace-imagesF-63-ground-truth.py'
      - 'reports/ocrspace-imagesF-63/**'
      - 'desktop/**'
      - 'tests/desktop-ui-contract.test.js'
      - '.github/workflows/dwbot-imagesF-63-exploratory.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  imagesf-63-exploratory:
    name: Windows OCR.Space Engine 2 - imagesF 63 exploratory PDF-first
    runs-on: windows-latest
    timeout-minutes: 240
    permissions:
      contents: read
    steps:
      - name: Check out the exact triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js 22.16.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.16.0
          cache: npm
          package-manager-cache: false
      - name: Install local PDF raster and OCR readers
        shell: powershell
        run: |
          choco install tesseract --version=5.5.3.20260724 --yes --no-progress
          choco install ghostscript --yes --no-progress
          Import-Module "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1"
          refreshenv
          $tesseract = Get-Command tesseract.exe -ErrorAction Stop
          $magick = Get-Command magick.exe -ErrorAction Stop
          $ghostscript = Get-Command gswin64c.exe -ErrorAction Stop
          & $ghostscript.Source -version
          if ($LASTEXITCODE -ne 0) { throw 'Ghostscript is required for PDF-page rasterization.' }
          $tessdata = Join-Path (Split-Path $tesseract.Source -Parent) 'tessdata'
          if (-not (Test-Path (Join-Path $tessdata 'eng.traineddata'))) { throw "English Tesseract model missing: $tessdata" }
          "TESSERACT_BIN=$($tesseract.Source)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "TESSERACT_LANG_PATH=$tessdata" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "IMAGEMAGICK_BIN=$($magick.Source)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install locked dependencies
        run: |
          node --version
          npm --version
          npm ci --no-audit --no-fund
      - name: Download exact reviewed 63-image archive
        shell: powershell
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'DWBOT_IMAGESF_HOLDOUT_CANDIDATE_63.zip'
          $url = 'https://github.com/user-attachments/files/34459783/DWBOT_IMAGESF_HOLDOUT_CANDIDATE_63.zip'
          curl.exe --location --fail --silent --show-error --output $archive $url
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the exact user-attached 63-image archive.' }
          if (-not (Test-Path $archive)) { throw 'Downloaded 63-image archive is missing.' }
          "OCRSPACE_63_ARCHIVE_PATH=$archive" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Get-Item $archive | Select-Object Name,Length
      - name: Verify archive fingerprint, exact member list, safe paths, and all image hashes
        shell: powershell
        env:
          OCRSPACE_63_ARCHIVE_PATH: ${{ runner.temp }}\DWBOT_IMAGESF_HOLDOUT_CANDIDATE_63.zip
          OCRSPACE_63_IMAGE_ROOT: ${{ runner.temp }}\dwbot-imagesF-63
          OCRSPACE_63_PREFLIGHT_REPORT: ${{ github.workspace }}\testdata\ocr-acceptance\imagesF-63-preflight.json
        run: |
          $python = Get-Command python.exe -ErrorAction Stop
          & $python.Source scripts/prepare-ocrspace-imagesF-63.py
          if ($LASTEXITCODE -ne 0) { throw '63-image archive preflight failed; OCR.Space submissions are prohibited.' }
      - name: Run OCR.Space Engine 2 PDF-first exploratory extraction
        shell: powershell
        env:
          OCRSPACE_API_KEY: ${{ secrets.OCRSPACE_API_KEY }}
          OCRSPACE_NETWORK_ALLOWLIST: '1'
          OCR_NON_OCR_NETWORK_RESTRICTED: '1'
          OCRSPACE_63_OUTPUT_DIR: ${{ github.workspace }}\testdata\ocrspace-imagesF-63-exploratory
        run: |
          if ([string]::IsNullOrWhiteSpace($env:OCRSPACE_API_KEY)) { throw 'Protected OCRSPACE_API_KEY secret is missing.' }
          node --check scripts/run-ocrspace-imagesF-63-exploratory.js
          npm run test:ocrspace
          if ($LASTEXITCODE -ne 0) { throw 'OCR.Space mocked contract tests failed; exploratory provider submissions are prohibited.' }
          npm run test:ocrspace-imagesF-63
          if ($LASTEXITCODE -ne 0) { throw '63-image exploratory extraction completed with a runner-level failure; inspect the per-image report.' }
      - name: Upload complete exploratory reports and PDF/raster artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dwbot-imagesF-63-ocrspace-exploratory
          path: |
            testdata/ocrspace-imagesF-63-exploratory/**
            testdata/ocr-acceptance/imagesF-63-preflight.json*
            testdata/ocr-acceptance/DWBOT_IMAGESF_HOLDOUT_CANDIDATE_MANIFEST.json
            docs/continuation/DWBOT-UPD-2026-11-05-002-groundtruth-gap-register.md
            docs/continuation/DWBOT-UPD-2026-11-06-004-imagesF-63-ground-truth.md
            testdata/ground-truth/imagesF-63-working-ground-truth-v6.json*
            scripts/evaluate-ocrspace-imagesF-63-ground-truth.py
          if-no-files-found: warn
          retention-days: 30
