name: DWBOT 19-image Gate B artifact verification and post-hoc evaluation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dwbot-imagesF-21-artifact-verification.yml'
      - 'scripts/verify-ocrspace-imagesF-21-artifacts.js'
      - 'scripts/recover-ocrspace-imagesF-21-local-readers.js'
      - 'scripts/evaluate-ocrspace-imagesF-63-ground-truth.py'
      - 'scripts/evaluate-ocrspace-pdf-text-layer.js'
      - 'tests/ocrspace-pdf-text-layer.test.js'
      - 'tests/ocrspace-imagesF-21-artifact-verifier.test.js'
      - 'tests/ocrspace-imagesF-21-ground-truth.test.js'
      - 'tests/ocrspace-imagesF-21-local-recovery.test.js'
      - 'tests/workflow-contract.test.js'
      - 'tests/test_ocrspace_imagesF_21_evaluator.py'
      - 'package.json'
      - 'testdata/imagesF-holdout-candidate-manifest.json'
      - 'testdata/ground-truth/imagesF-63-working-ground-truth-v6.json'
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Completed 63-image OCR.Space exploratory run ID; this workflow never submits OCR requests.'
        required: true
        type: string

concurrency:
  group: dwbot-imagesF-19-gateB-artifact-verification-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out current verification tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.17.0
          cache: npm
          package-manager-cache: false

      - name: Install bounded PDF and image verification tools
        shell: powershell
        run: |
          choco install tesseract --version=5.5.3.20260724 --yes --no-progress
          Import-Module "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1"
          refreshenv
          $tesseract = Get-Command tesseract.exe -ErrorAction Stop
          $tessdata = Join-Path (Split-Path $tesseract.Source -Parent) 'tessdata'
          if (-not (Test-Path (Join-Path $tessdata 'eng.traineddata'))) { throw 'English Tesseract model is missing.' }
          "TESSERACT_BIN=$($tesseract.Source)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "TESSERACT_LANG_PATH=$tessdata" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $magick = Get-Command magick.exe -ErrorAction SilentlyContinue
          if (-not $magick) {
            choco install imagemagick --yes --no-progress
            Import-Module "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1"
            refreshenv
            $magick = Get-Command magick.exe -ErrorAction Stop
          }
          $ghostscript = Get-Command gswin64c.exe -ErrorAction SilentlyContinue
          if (-not $ghostscript) {
            choco install ghostscript --yes --no-progress
            Import-Module "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1"
            refreshenv
            $ghostscript = Get-Command gswin64c.exe -ErrorAction Stop
          }
          & $magick.Source -version
          if ($LASTEXITCODE -ne 0) { throw 'ImageMagick is required for raster verification.' }
          & $ghostscript.Source -version
          if ($LASTEXITCODE -ne 0) { throw 'Ghostscript is required for searchable-PDF verification.' }
          "IMAGEMAGICK_BIN=$($magick.Source)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "GHOSTSCRIPT_BIN=$($ghostscript.Source)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install locked dependencies and run no-provider contract tests
        run: |
          node --version
          npm --version
          npm ci --no-audit --no-fund
          node --check scripts/recover-ocrspace-imagesF-21-local-readers.js
          node --check scripts/evaluate-ocrspace-pdf-text-layer.js
          npm run test:ocrspace
          node --test tests/workflow-contract.test.js

      - name: Validate source run and download its exact artifact
        id: source-artifact
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id || '42160979140' }}
        run: |
          $sourceRunId = 0L
          if (-not [long]::TryParse($env:SOURCE_RUN_ID, [ref]$sourceRunId)) { throw 'source_run_id must be a numeric GitHub Actions run ID.' }
          $sourceJson = gh run view $sourceRunId --repo $env:GITHUB_REPOSITORY --json workflowName,headSha,status,conclusion
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect the requested OCR.Space source run.' }
          $sourceRun = $sourceJson | ConvertFrom-Json
          if ($sourceRun.workflowName -ne 'DWBOT imagesF 63 exploratory OCR.Space') { throw 'Source run is not the authorized 63-image exploratory workflow.' }
          if ($sourceRun.status -ne 'completed') { throw 'Source extraction must finish before artifact verification.' }
          $sourceSha = $sourceRun.headSha
          $downloadRoot = Join-Path $env:RUNNER_TEMP ('dwbot-artifact-verify-' + $sourceRunId)
          New-Item -ItemType Directory -Force $downloadRoot | Out-Null
          gh run download $sourceRunId --repo $env:GITHUB_REPOSITORY --name dwbot-imagesF-63-ocrspace-exploratory --dir $downloadRoot
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the source run artifact.' }
          $runReports = @(Get-ChildItem -Path $downloadRoot -Filter 'ocrspace-imagesF-63-exploratory-report.json' -File -Recurse)
          $progressFiles = @(Get-ChildItem -Path $downloadRoot -Filter 'progress.json' -File -Recurse)
          $groundTruthPath = Join-Path $env:GITHUB_WORKSPACE 'testdata\ground-truth\imagesF-63-working-ground-truth-v6.json'
          if (-not (Test-Path $groundTruthPath)) { throw 'Current source-bound v6 ground-truth JSON is missing from checkout.' }
          $preflightFiles = @(Get-ChildItem -Path $downloadRoot -Filter 'imagesF-63-preflight.json' -File -Recurse)
          $networkLogs = @(Get-ChildItem -Path $downloadRoot -Filter 'imagesF-63-blocked-network-attempts.log' -File -Recurse)
          if ($runReports.Count -gt 1 -or $progressFiles.Count -ne 1 -or $preflightFiles.Count -ne 1 -or $networkLogs.Count -gt 1) {
            throw 'Source artifact has duplicate or ambiguous report, progress, preflight, or network-log files.'
          }
          if ($runReports.Count -eq 0 -and $progressFiles.Count -ne 1) { throw 'Source artifact has neither a final run report nor a single progress file.' }
          $selectedRunReport = if ($runReports.Count -eq 1) { $runReports[0].FullName } else { $progressFiles[0].FullName }
          $artifactRoot = $progressFiles[0].DirectoryName
          $sourceWorkflowJson = gh api "repos/$env:GITHUB_REPOSITORY/contents/.github/workflows/dwbot-imagesF-63-exploratory.yml?ref=$sourceSha"
          if ($LASTEXITCODE -ne 0) { throw 'Could not retrieve the workflow source at the extraction commit.' }
          $sourceWorkflow = $sourceWorkflowJson | ConvertFrom-Json
          $sourceWorkflowPath = Join-Path $env:RUNNER_TEMP 'source-imagesF-63-workflow.yml'
          [System.IO.File]::WriteAllBytes($sourceWorkflowPath, [Convert]::FromBase64String($sourceWorkflow.content))
          "DWBOT_SOURCE_RUN_ID=$sourceRunId" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "DWBOT_SOURCE_RUN_SHA=$sourceSha" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "DWBOT_DOWNLOAD_ROOT=$downloadRoot" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "DWBOT_ARTIFACT_ROOT=$artifactRoot" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "DWBOT_RUN_REPORT=$selectedRunReport" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "DWBOT_GROUND_TRUTH=$groundTruthPath" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "DWBOT_OLD_PREFLIGHT=$($preflightFiles[0].FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $networkLogPath = if ($networkLogs.Count -eq 1) { $networkLogs[0].FullName } else { Join-Path $downloadRoot 'missing-network-log.log' }
          "DWBOT_NETWORK_LOG=$networkLogPath" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $networkReconciliationPath = Join-Path $env:GITHUB_WORKSPACE 'testdata\ocr-acceptance\network-log-reconciliation.json'
          New-Item -ItemType Directory -Force (Split-Path $networkReconciliationPath -Parent) | Out-Null
          $sourceWorkflowText = Get-Content -Raw $sourceWorkflowPath
          $blockGuardJson = gh api "repos/$env:GITHUB_REPOSITORY/contents/scripts/block-network.js?ref=$sourceSha"
          if ($LASTEXITCODE -ne 0) { throw 'Could not retrieve the network-guard source at the extraction commit.' }
          $blockGuard = $blockGuardJson | ConvertFrom-Json
          $blockGuardText = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(($blockGuard.content -replace '\s','')))
          $sourceJobLogs = gh run view $sourceRunId --repo $env:GITHUB_REPOSITORY --log 2>$null
          $jobLogsAvailable = $LASTEXITCODE -eq 0
          $blockedMarkers = 0
          if ($jobLogsAvailable) { $blockedMarkers = ([regex]::Matches(($sourceJobLogs -join ' '), '\[NON-OCR-SPACE-EGRESS-RESTRICTED\] denied')).Count }
          $runData = Get-Content -Raw $selectedRunReport | ConvertFrom-Json
          $networkFailureRows = @($runData.results | Where-Object { $_.failure.code -eq 'OCR_NETWORK_BLOCKED' -or $_.failure.message -match 'Non-OCR.Space network destination' })
          $reconciliation = [ordered]@{
            schemaVersion = 1
            status = if ($networkLogs.Count -eq 1) { 'ORIGINAL_LOG_PRESENT' } elseif ($blockedMarkers -gt 0 -or $networkFailureRows.Count -gt 0) { 'BLOCKED_ATTEMPTS_OBSERVED' } else { 'RECONSTRUCTED_LIMITED_EVIDENCE' }
            sourceRunId = $sourceRunId
            sourceRunSha = $sourceSha
            originalDiagnosticLog = if ($networkLogs.Count -eq 1) { 'PRESENT_IN_SOURCE_ARTIFACT' } else { 'MISSING_FROM_SOURCE_ARTIFACT' }
            sourceWorkflowRestrictedEgressEnabled = $sourceWorkflowText.Contains("OCR_NON_OCR_NETWORK_RESTRICTED: '1'")
            sourceWorkflowOcrSpaceAllowlistEnabled = $sourceWorkflowText.Contains("OCRSPACE_NETWORK_ALLOWLIST: '1'")
            sourceWorkflowDiagnosticLogPathConfigured = $sourceWorkflowText -match 'OCR_NON_OCR_NETWORK_LOG:'
            guardWritesOnlyWhenLogPathConfigured = $blockGuardText -match 'if \(logPath\)'
            sourceJobLogsAvailable = $jobLogsAvailable
            blockedMarkersObservedInJobLogs = $blockedMarkers
            perImageNetworkBlockFailureRows = $networkFailureRows.Count
            originalBlockedAttemptCount = $null
            zeroAttemptsClaimed = $false
            limitation = 'The source workflow enabled the application-level non-OCR egress guard but did not set OCR_NON_OCR_NETWORK_LOG. The guard writes events only when that path is configured. Job-log and per-image scans are corroborating observations, not a complete reconstruction of the missing original event log; no zero-attempt claim is made.'
          }
          $reconciliation | ConvertTo-Json -Depth 20 | Set-Content -Encoding utf8 $networkReconciliationPath
          $reconciliationTextPath = Join-Path $env:GITHUB_WORKSPACE 'testdata\\ocr-acceptance\\network-log-reconciliation.txt'
          $reconciliationLines = @(
            'RECONSTRUCTED LIMITED NETWORK EVIDENCE — NOT THE ORIGINAL EVENT LOG',
            "Source run: $sourceRunId ($sourceSha)",
            "Original diagnostic log: $($reconciliation.originalDiagnosticLog)",
            "Source workflow egress guard enabled: $($reconciliation.sourceWorkflowRestrictedEgressEnabled)",
            "OCR.Space allowlist enabled: $($reconciliation.sourceWorkflowOcrSpaceAllowlistEnabled)",
            "Diagnostic path configured in source workflow: $($reconciliation.sourceWorkflowDiagnosticLogPathConfigured)",
            "Blocked markers observed in available job logs: $blockedMarkers",
            "Per-image network-block failure rows: $($networkFailureRows.Count)",
            'Historical blocked-attempt count: UNKNOWN',
            'No zero-attempt claim is made. This limited reconstruction does not satisfy Gate A or Gate B network proof.'
          )
          [System.IO.File]::WriteAllLines($reconciliationTextPath, $reconciliationLines, (New-Object System.Text.UTF8Encoding($false)))

          "DWBOT_NETWORK_RECONCILIATION=$networkReconciliationPath" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "DWBOT_SOURCE_WORKFLOW=$sourceWorkflowPath" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Source run $sourceRunId at $sourceSha; artifact root $artifactRoot"

      - name: Download and freshly verify the exact 63-image source archive
        shell: powershell
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'DWBOT_IMAGESF_HOLDOUT_CANDIDATE_63.zip'
          $url = 'https://github.com/user-attachments/files/34459783/DWBOT_IMAGESF_HOLDOUT_CANDIDATE_63.zip'
          curl.exe --location --fail --silent --show-error --output $archive $url
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the exact reviewed source archive.' }
          $imageRoot = Join-Path $env:GITHUB_WORKSPACE 'testdata\imagesF-63'
          $freshPreflight = Join-Path $env:GITHUB_WORKSPACE 'testdata\ocr-acceptance\fresh-imagesF-63-preflight.json'
          New-Item -ItemType Directory -Force (Split-Path $freshPreflight -Parent) | Out-Null
          $env:OCRSPACE_63_ARCHIVE_PATH = $archive
          $env:OCRSPACE_63_IMAGE_ROOT = $imageRoot
          $env:OCRSPACE_63_PREFLIGHT_REPORT = $freshPreflight
          python scripts/prepare-ocrspace-imagesF-63.py
          if ($LASTEXITCODE -ne 0) { throw 'Fresh source archive/member hash verification failed.' }
          "DWBOT_FRESH_PREFLIGHT=$freshPreflight" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "DWBOT_SOURCE_IMAGE_ROOT=$imageRoot" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Recover only timed-out local readers from verified PDF-derived rasters
        id: local-reader-recovery
        continue-on-error: true
        shell: powershell
        env:
          OCRSPACE_ENABLED: '0'
          OCRSPACE_NETWORK_ALLOWLIST: '0'
          OCR_NON_OCR_NETWORK_RESTRICTED: '1'
          OCR_IMAGE_TIMEOUT_MS: '180000'
          OCR_SUPERVISED_TIMEOUT_MS: '185000'
          OCR_NON_OCR_NETWORK_LOG: ${{ github.workspace }}/testdata/ocr-acceptance/local-reader-recovery-network.log
        run: |
          $recoveredRun = Join-Path $env:GITHUB_WORKSPACE 'testdata\ocrspace-imagesF-63-exploratory\recovered-run-report-21.json'
          $recoveryReport = Join-Path $env:GITHUB_WORKSPACE 'testdata\ocrspace-imagesF-63-exploratory\local-reader-recovery-21.json'
          $recoveryNetworkLog = Join-Path $env:GITHUB_WORKSPACE 'testdata\ocr-acceptance\local-reader-recovery-network.log'
          New-Item -ItemType Directory -Force (Split-Path $recoveryReport -Parent) | Out-Null
          New-Item -ItemType Directory -Force (Split-Path $recoveryNetworkLog -Parent) | Out-Null
          [System.IO.File]::WriteAllText($recoveryNetworkLog, '')
          node scripts/recover-ocrspace-imagesF-21-local-readers.js --run-report $env:DWBOT_RUN_REPORT --ground-truth $env:DWBOT_GROUND_TRUTH --artifact-root $env:DWBOT_ARTIFACT_ROOT --output-run-report $recoveredRun --recovery-report $recoveryReport --network-log $env:OCR_NON_OCR_NETWORK_LOG
          if (Test-Path $recoveredRun) {
            "DWBOT_RUN_REPORT=$recoveredRun" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          }
          "DWBOT_LOCAL_READER_RECOVERY_REPORT=$recoveryReport" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "DWBOT_LOCAL_READER_RECOVERY_NETWORK_LOG=$recoveryNetworkLog" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify the 19 selected PDFs, text layers, rasters, provenance and security
        id: artifact-verification
        shell: powershell
        env:
          OCRSPACE_API_KEY: ${{ secrets.OCRSPACE_API_KEY }}
        run: |
          $output = Join-Path $env:GITHUB_WORKSPACE 'testdata\ocrspace-imagesF-63-exploratory\artifact-verification-19.json'
          New-Item -ItemType Directory -Force (Split-Path $output -Parent) | Out-Null
          node scripts/verify-ocrspace-imagesF-21-artifacts.js --run-report $env:DWBOT_RUN_REPORT --ground-truth $env:DWBOT_GROUND_TRUTH --preflight-report $env:DWBOT_OLD_PREFLIGHT --fresh-preflight-report $env:DWBOT_FRESH_PREFLIGHT --source-image-root $env:DWBOT_SOURCE_IMAGE_ROOT --artifact-root $env:DWBOT_ARTIFACT_ROOT --network-log $env:DWBOT_NETWORK_LOG --recovery-network-log $env:DWBOT_LOCAL_READER_RECOVERY_NETWORK_LOG --network-log-reconciliation $env:DWBOT_NETWORK_RECONCILIATION --workflow-file $env:DWBOT_SOURCE_WORKFLOW --output $output
          "DWBOT_ARTIFACT_VERIFICATION_REPORT=$output" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run 19-image Gate B post-hoc evaluation without provider requests
        if: always()
        shell: powershell
        run: |
          if (-not $env:DWBOT_RUN_REPORT -or -not $env:DWBOT_GROUND_TRUTH) {
            Write-Host 'Post-hoc evaluation skipped because source run artifacts were not available.'
            exit 0
          }
          $output = Join-Path $env:GITHUB_WORKSPACE 'testdata\ocrspace-imagesF-63-exploratory\posthoc-evaluation-19.json'
          $args = @('--run-report', $env:DWBOT_RUN_REPORT, '--ground-truth', $env:DWBOT_GROUND_TRUTH, '--output', $output, '--inventory', 'gate-b-complete-ground-truth-19')
          if ($env:DWBOT_ARTIFACT_VERIFICATION_REPORT -and (Test-Path $env:DWBOT_ARTIFACT_VERIFICATION_REPORT)) {
            $args += @('--artifact-verification-report', $env:DWBOT_ARTIFACT_VERIFICATION_REPORT)
          }
          python scripts/evaluate-ocrspace-imagesF-63-ground-truth.py @args
          if ($LASTEXITCODE -ne 0) { throw 'Post-hoc evaluation did not complete; inspect its report and logs.' }
          "DWBOT_POSTHOC_REPORT=$output" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run searchable-PDF text-layer and multi-reader fusion analysis
        if: always()
        shell: powershell
        run: |
          if (-not $env:DWBOT_RUN_REPORT -or -not $env:DWBOT_GROUND_TRUTH -or -not $env:DWBOT_ARTIFACT_ROOT) {
            Write-Host 'PDF text-layer analysis skipped because verified source artifacts are unavailable.'
            exit 0
          }
          $output = Join-Path $env:GITHUB_WORKSPACE 'testdata\ocrspace-imagesF-63-exploratory\pdf-text-layer-analysis-19.json'
          node scripts/evaluate-ocrspace-pdf-text-layer.js --run-report $env:DWBOT_RUN_REPORT --ground-truth $env:DWBOT_GROUND_TRUTH --artifact-root $env:DWBOT_ARTIFACT_ROOT --inventory gate-b-complete-ground-truth-19 --output $output

      - name: Run 21-image diagnostic post-hoc evaluation without provider requests
        if: always()
        shell: powershell
        run: |
          if (-not $env:DWBOT_RUN_REPORT -or -not $env:DWBOT_GROUND_TRUTH) {
            Write-Host '21-image diagnostic evaluation skipped because source reports were unavailable.'
            exit 0
          }
          $output = Join-Path $env:GITHUB_WORKSPACE 'testdata\\ocrspace-imagesF-63-exploratory\\posthoc-evaluation-21-diagnostic.json'
          python scripts/evaluate-ocrspace-imagesF-63-ground-truth.py --run-report $env:DWBOT_RUN_REPORT --ground-truth $env:DWBOT_GROUND_TRUTH --output $output --inventory complete-ground-truth-21
          if ($LASTEXITCODE -ne 0) { throw '21-image diagnostic evaluation did not complete.' }

      - name: Run 21-image searchable-PDF text-layer and multi-reader analysis
        if: always()
        shell: powershell
        run: |
          if (-not $env:DWBOT_RUN_REPORT -or -not $env:DWBOT_GROUND_TRUTH -or -not $env:DWBOT_ARTIFACT_ROOT) {
            Write-Host '21-image PDF text-layer analysis skipped because source artifacts were unavailable.'
            exit 0
          }
          $output = Join-Path $env:GITHUB_WORKSPACE 'testdata\\ocrspace-imagesF-63-exploratory\\pdf-text-layer-analysis-21.json'
          node scripts/evaluate-ocrspace-pdf-text-layer.js --run-report $env:DWBOT_RUN_REPORT --ground-truth $env:DWBOT_GROUND_TRUTH --artifact-root $env:DWBOT_ARTIFACT_ROOT --inventory complete-ground-truth-21 --output $output
          if ($LASTEXITCODE -ne 0) { throw '21-image PDF text-layer analysis did not complete.' }

      - name: Upload verification and post-hoc evaluation reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dwbot-imagesF-19-gateB-artifact-verification-${{ inputs.source_run_id || '42160979140' }}
          path: |
            testdata/ocrspace-imagesF-63-exploratory/artifact-verification-19.json
            testdata/ocrspace-imagesF-63-exploratory/posthoc-evaluation-19.json
            testdata/ocrspace-imagesF-63-exploratory/pdf-text-layer-analysis-19.json*
            testdata/ocrspace-imagesF-63-exploratory/posthoc-evaluation-21-diagnostic.json*
            testdata/ocrspace-imagesF-63-exploratory/pdf-text-layer-analysis-21.json*
            testdata/ocrspace-imagesF-63-exploratory/recovered-run-report-21.json*
            testdata/ocrspace-imagesF-63-exploratory/local-reader-recovery-21.json
            testdata/ocr-acceptance/local-reader-recovery-network.log
            testdata/ocr-acceptance/network-log-reconciliation.json
            testdata/ocr-acceptance/network-log-reconciliation.txt
            testdata/ocr-acceptance/fresh-imagesF-63-preflight.json*
          if-no-files-found: warn
          retention-days: 30
