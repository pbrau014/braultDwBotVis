name: DWBOT verification

concurrency:
  group: dwbot-verification-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node22-linux:
    name: Node.js 22.16.0 - Linux offline verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the exact triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js 22.16.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.16.0
          cache: npm
          package-manager-cache: false
      - name: Provision local English Tesseract.js model
        run: |
          sudo apt-get update
          sudo apt-get install --yes tesseract-ocr-eng
          model_path="$(find /usr/share/tesseract-ocr -type f -name eng.traineddata -print -quit)"
          test -n "$model_path"
          echo "TESSERACT_LANG_PATH=$(dirname "$model_path")" >> "$GITHUB_ENV"
      - name: Install locked dependencies
        run: |
          node --version
          npm --version
          npm ci --no-audit --no-fund
      - name: Syntax checks
        run: |
          node --check src/bot.js
          node --check src/desktop-service.js
          node --check src/desktop-bridge.js
          node --check src/desktop-test-preflight.js
          node --check src/ocrspace-client.js
          node --check src/ocrspace-pdf-first.js
          node --check src/ocrspace-quota-ledger.js
          node --check src/ocrspace-field-evidence.js
          node --check src/ocrspace-prepass.js
          node --check src/ocrspace-reconciliation.js
          node --check src/attachment-download.js
          node --check src/discord-test-preflight.js
          node --check src/ocr-sequence-checkpoint.js
          node --check scripts/run-ocr-sequence.js
          node --check scripts/run-additional-screenshot-regression.js
          node --check scripts/run-persistence-recovery.js
      - name: OCR.space mocked contract
        run: npm run test:ocrspace
      - name: Discord offline preflight and policy
        run: npm run test:discord-preflight
      - name: Desktop offline configuration preflight
        run: npm run preflight:desktop-test
      - name: Desktop service and bridge tests
        run: npm run test:desktop
      - name: Process-level JSON and SQLite recovery
        run: npm run test:persistence-recovery
      - name: Full project suite
        run: npm test

  windows-node22-native-ocr:
    name: Windows Node.js 22.16.0 - native Tesseract and persistence
    runs-on: windows-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Check out the exact triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js 22.16.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.16.0
          cache: npm
          package-manager-cache: false
      - name: Install native OCR prerequisites
        shell: powershell
        run: |
          choco install tesseract --version=5.5.3.20260724 --yes --no-progress
          choco install ghostscript --yes --no-progress
          Import-Module "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1"
          refreshenv
          $tesseract = Get-Command tesseract.exe -ErrorAction Stop
          $magick = Get-Command magick.exe -ErrorAction Stop
          $ghostscript = Get-Command gswin64c.exe -ErrorAction Stop
          & $ghostscript.Source -version
          if ($LASTEXITCODE -ne 0) { throw 'Ghostscript is required for ImageMagick PDF rasterization.' }
          $version = (& $tesseract.Source --version | Select-Object -First 1).Trim()
          Write-Host "Native Tesseract: $version"
          if ($version -notmatch '^tesseract\s+v?5\.') { throw "Expected native Tesseract 5.x: $version" }
          & $tesseract.Source --list-langs
          $tessdata = Join-Path (Split-Path $tesseract.Source -Parent) 'tessdata'
          if (-not (Test-Path (Join-Path $tessdata 'eng.traineddata'))) { throw "English language model not found in $tessdata" }
          & $magick.Source -version | Select-Object -First 2
          "TESSERACT_BIN=$($tesseract.Source)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "TESSERACT_LANG_PATH=$tessdata" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "IMAGEMAGICK_BIN=$($magick.Source)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install isolated OpenCV geometry runtime
        shell: powershell
        run: |
          $python = Get-Command python.exe -ErrorAction Stop
          $venv = Join-Path $env:RUNNER_TEMP 'dwbot-opencv'
          & $python.Source -m venv $venv
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the isolated OpenCV environment.' }
          $opencvPython = Join-Path $venv 'Scripts\python.exe'
          & $opencvPython -m pip install --disable-pip-version-check --no-warn-script-location --only-binary=:all: opencv-python-headless==4.10.0.84
          if ($LASTEXITCODE -ne 0) { throw 'Could not install the pinned OpenCV wheel.' }
          & $opencvPython -c 'import cv2, numpy; print(cv2.__version__, numpy.__version__)'
          if ($LASTEXITCODE -ne 0) { throw 'OpenCV geometry runtime failed its import check.' }
          "OPENCV_PYTHON_BIN=$opencvPython" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install locked dependencies
        run: |
          node --version
          npm --version
          npm ci --no-audit --no-fund
      - name: Reconstruct and verify eligible-only 56-image archive before provider access
        shell: powershell
        env:
          OCRSPACE_56_ARCHIVE_PATH: ${{ runner.temp }}\\imgsHalf1-eligible-56.zip
          OCRSPACE_56_IMAGE_ROOT: ${{ runner.temp }}\\imgsHalf1-eligible-56
          OCRSPACE_56_PREFLIGHT_REPORT: ${{ github.workspace }}\\testdata\\ocr-acceptance\\ocrspace-56-preflight.json
        run: |
          $python = Get-Command python.exe -ErrorAction Stop
          & $python.Source scripts/prepare-ocrspace-eligible-56.py
          if ($LASTEXITCODE -ne 0) { throw '56-image archive reconstruction or integrity preflight failed; OCR.Space provider submissions are prohibited.' }
      - name: Windows process-level persistence and recovery
        run: npm run test:persistence-recovery
      - name: Full Windows Node 22 test suite
        run: npm test
      - name: Verify protected OCR.Space secret is configured (value withheld)
        shell: powershell
        env:
          OCRSPACE_API_KEY: ${{ secrets.OCRSPACE_API_KEY }}
        run: |
          $configured = -not [string]::IsNullOrWhiteSpace($env:OCRSPACE_API_KEY)
          Write-Host "OCRSPACE_API_KEY configured: $configured"
          if (-not $configured) { throw 'Protected OCRSPACE_API_KEY secret is missing or empty.' }
      - name: Current-source Tesseract.js and native Tesseract screenshot acceptance
        shell: powershell
        env:
          OCRSPACE_ENABLED: '1'
          OCRSPACE_API_KEY: ${{ secrets.OCRSPACE_API_KEY }}
          OCRSPACE_NETWORK_ALLOWLIST: '1'
          OCR_NON_OCR_NETWORK_RESTRICTED: '1'
        run: npm run test:windows-native-ocr
      - name: Upload Windows acceptance evidence even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dwbot-windows-node22-native-ocr-and-recovery
          path: |
            testdata/ocr-acceptance/**
            testdata/persistence-recovery/**
          if-no-files-found: warn
          retention-days: 30

  manual-and-package:
    name: PDF manual and clean package verification
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.16.0
          cache: npm
          package-manager-cache: false
      - name: Install native Tesseract language model for clean-package tests
        shell: powershell
        run: |
          choco install tesseract --version=5.5.3.20260724 --yes --no-progress
          Import-Module "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1"
          refreshenv
          $tesseract = Get-Command tesseract.exe -ErrorAction Stop
          $tessdata = Join-Path (Split-Path $tesseract.Source -Parent) 'tessdata'
          if (-not (Test-Path (Join-Path $tessdata 'eng.traineddata'))) { throw "English language model not found in $tessdata" }
          "TESSERACT_BIN=$($tesseract.Source)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "TESSERACT_LANG_PATH=$tessdata" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install Pandoc and MiKTeX
        shell: powershell
        run: |
          choco install pandoc --yes --no-progress
          choco install typst --yes --no-progress --execution-timeout=900 --retrycount=3 --retryinterval=10
          Import-Module "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1"
          refreshenv
          pandoc --version
          typst --version
      - name: Render PDF manual
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force release-artifacts | Out-Null
          pandoc docs/iteration23/DWBOT_LOCAL_OPERATIONS_AND_RELEASE_VERIFICATION_MANUAL_2026-11-04.md -o release-artifacts/DWBOT_LOCAL_OPERATIONS_AND_RELEASE_VERIFICATION_MANUAL_2026-11-04.pdf --pdf-engine=typst --toc --number-sections -V geometry:margin=0.75in -V colorlinks=true
          if ($LASTEXITCODE -ne 0) { throw "Operations PDF render failed: $LASTEXITCODE" }
          if ((Get-Item release-artifacts/DWBOT_LOCAL_OPERATIONS_AND_RELEASE_VERIFICATION_MANUAL_2026-11-04.pdf).Length -lt 10000) { throw 'Operations PDF output unexpectedly small' }
          pandoc docs/user/DWBOT_USER_MANUAL.md -o release-artifacts/DWBOT_USER_MANUAL.pdf --pdf-engine=typst --toc --toc-depth=1 --number-sections --include-in-header=docs/user/user-manual-header.typ -V geometry:margin=0.75in -V colorlinks=true
          if ($LASTEXITCODE -ne 0) { throw "User PDF render failed: $LASTEXITCODE" }
          if ((Get-Item release-artifacts/DWBOT_USER_MANUAL.pdf).Length -lt 10000) { throw 'User PDF output unexpectedly small' }
      - name: Package tracked source and verify clean extraction
        shell: powershell
        run: ./scripts/package-release.ps1
      - name: Upload manual and package evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dwbot-pdf-manual-and-clean-package
          path: release-artifacts/**
          if-no-files-found: warn
          retention-days: 30
  imagesf-63-exploratory:
    name: Windows OCR.Space Engine 2 - imagesF 63 exploratory PDF-first
    runs-on: windows-latest
    timeout-minutes: 240
    permissions:
      contents: read
    steps:
      - name: Check out the exact triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js 22.16.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.16.0
          cache: npm
          package-manager-cache: false
      - name: Install local PDF raster and OCR readers
        shell: powershell
        run: |
          choco install tesseract --version=5.5.3.20260724 --yes --no-progress
          choco install ghostscript --yes --no-progress
          Import-Module "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1"
          refreshenv
          $tesseract = Get-Command tesseract.exe -ErrorAction Stop
          $magick = Get-Command magick.exe -ErrorAction Stop
          $ghostscript = Get-Command gswin64c.exe -ErrorAction Stop
          & $ghostscript.Source -version
          if ($LASTEXITCODE -ne 0) { throw 'Ghostscript is required for PDF-page rasterization.' }
          $tessdata = Join-Path (Split-Path $tesseract.Source -Parent) 'tessdata'
          if (-not (Test-Path (Join-Path $tessdata 'eng.traineddata'))) { throw "English Tesseract model missing: $tessdata" }
          "TESSERACT_BIN=$($tesseract.Source)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "TESSERACT_LANG_PATH=$tessdata" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "IMAGEMAGICK_BIN=$($magick.Source)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install locked dependencies
        run: |
          node --version
          npm --version
          npm ci --no-audit --no-fund
      - name: Download exact reviewed 63-image archive
        shell: powershell
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'DWBOT_IMAGESF_HOLDOUT_CANDIDATE_63.zip'
          $url = 'https://github.com/user-attachments/files/34459783/DWBOT_IMAGESF_HOLDOUT_CANDIDATE_63.zip'
          curl.exe --location --fail --silent --show-error --output $archive $url
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the exact user-attached 63-image archive.' }
          if (-not (Test-Path $archive)) { throw 'Downloaded 63-image archive is missing.' }
          "OCRSPACE_63_ARCHIVE_PATH=$archive" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Get-Item $archive | Select-Object Name,Length
      - name: Verify archive fingerprint, exact member list, safe paths, and all image hashes
        shell: powershell
        env:
          OCRSPACE_63_ARCHIVE_PATH: ${{ runner.temp }}\DWBOT_IMAGESF_HOLDOUT_CANDIDATE_63.zip
          OCRSPACE_63_IMAGE_ROOT: ${{ runner.temp }}\dwbot-imagesF-63
          OCRSPACE_63_PREFLIGHT_REPORT: ${{ github.workspace }}\testdata\ocr-acceptance\imagesF-63-preflight.json
        run: |
          $python = Get-Command python.exe -ErrorAction Stop
          & $python.Source scripts/prepare-ocrspace-imagesF-63.py
          if ($LASTEXITCODE -ne 0) { throw '63-image archive preflight failed; OCR.Space submissions are prohibited.' }
      - name: Run OCR.Space Engine 2 PDF-first exploratory extraction
        shell: powershell
        env:
          OCRSPACE_API_KEY: ${{ secrets.OCRSPACE_API_KEY }}
          OCRSPACE_NETWORK_ALLOWLIST: '1'
          OCR_NON_OCR_NETWORK_RESTRICTED: '1'
          OCRSPACE_63_OUTPUT_DIR: ${{ github.workspace }}\testdata\ocrspace-imagesF-63-exploratory
        run: |
          if ([string]::IsNullOrWhiteSpace($env:OCRSPACE_API_KEY)) { throw 'Protected OCRSPACE_API_KEY secret is missing.' }
          node --check scripts/run-ocrspace-imagesF-63-exploratory.js
          npm run test:ocrspace
          if ($LASTEXITCODE -ne 0) { throw 'OCR.Space mocked contract tests failed; exploratory provider submissions are prohibited.' }
          npm run test:ocrspace-imagesF-63
          if ($LASTEXITCODE -ne 0) { throw '63-image exploratory extraction completed with a runner-level failure; inspect the per-image report.' }
      - name: Upload complete exploratory reports and PDF/raster artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dwbot-imagesF-63-ocrspace-exploratory
          path: |
            testdata/ocrspace-imagesF-63-exploratory/**
            testdata/ocr-acceptance/imagesF-63-preflight.json*
            testdata/ocr-acceptance/DWBOT_IMAGESF_HOLDOUT_CANDIDATE_MANIFEST.json
            docs/continuation/DWBOT-UPD-2026-11-05-002-groundtruth-gap-register.md
          if-no-files-found: warn
          retention-days: 30

