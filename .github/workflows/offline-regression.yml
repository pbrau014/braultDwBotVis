name: DWBOT offline regression

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-regression:
    name: Offline regression (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.16.0", "24"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Syntax check
        run: |
          node --check src/bot.js
          node --check src/tournament.js
          node --check src/yolo-formats.js
      - name: Complete offline test suite
        run: npm test
